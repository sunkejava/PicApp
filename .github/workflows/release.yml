name: Build and Release

on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Publish backend (Linux x64)
        run: dotnet publish server/Wallpaper.Api/Wallpaper.Api.csproj -c Release -r linux-x64 --self-contained true -p:PublishSingleFile=true -p:PublishTrimmed=false -o artifacts/server-linux-x64
      - name: Publish backend (Windows x64)
        run: dotnet publish server/Wallpaper.Api/Wallpaper.Api.csproj -c Release -r win-x64 --self-contained true -p:PublishSingleFile=true -p:PublishTrimmed=false -o artifacts/server-win-x64
      - name: Build mini program
        working-directory: miniapp
        run: |
          npm install
          npm run build:weapp
          cd dist && zip -r ../../artifacts/theme-wallpaper-weapp.zip .
      - name: Package server
        run: |
          cd artifacts && zip -r wallpaper-api-linux-x64.zip server-linux-x64 && zip -r wallpaper-api-win-x64.zip server-win-x64
      - name: Upload workflow artifacts
        uses: actions/upload-artifact@v4
        with:
          name: PicApp-${{ github.sha }}
          path: artifacts/*.zip
      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: artifacts/*.zip
